spring.application.name=contract-manager

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

contract.expiring-soon-days=30
contract.status-update-cron=0 0 1 * * *

# Frontend
app.frontend-url=${FRONTEND_URL}

# Default Admin
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Attachments
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB